name: Build Android APK

# Builds an installable debug APK and keeps it for download:
#   - every run: Actions tab -> the run -> Artifacts -> harvana-apk
#   - every tag like v1.0: also attached to a GitHub Release
on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed only to attach the APK to a release on tags
      actions: write    # lets the build delete old APK artifacts so the storage quota never fills

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate the Gradle config from app/module.toml
      # CodeAssist builds from app/module.toml, so the toml is the one source of truth. No Gradle file is stored in the repo: this writes
      # app/build.gradle, settings.gradle, build.gradle and gradle.properties from it
      # (SDK levels, version, build types and every dependency) so CI builds exactly what CodeAssist builds.
      run: python3 tools/module_toml_to_gradle.py

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    # JVM unit tests (pure classes). Fails the build.
    - name: Unit tests
      run: gradle :app:testDebugUnitTest --stacktrace

    # Debug-signed with the fixed debug key, so it installs directly on a phone (enable "install unknown apps").
    - name: Build debug APK
      run: gradle :app:assembleDebug --stacktrace

    - name: Name the APK
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/debug/*.apk "dist/harvana-${GITHUB_SHA::7}.apk"
        sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

    - name: Delete old APK artifacts
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' \
          | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}" || true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: harvana-apk
        path: dist/
        retention-days: 1   # shortest GitHub allows; the repo's artifact storage quota filled up
        if-no-files-found: error

    - name: Attach to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
