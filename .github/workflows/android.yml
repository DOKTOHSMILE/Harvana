name: Ajoo Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Validate CodeAssist Configuration
      run: |
        echo "Checking for CodeAssist module configuration..."
        if [ -f "app/module.toml" ]; then
          echo "Success: app/module.toml found."
        else
          echo "Error: app/module.toml is missing!"
          exit 1
        fi
        
        if [ -f "app/src/main/AndroidManifest.xml" ]; then
          echo "Success: AndroidManifest.xml found."
        else
          echo "Error: AndroidManifest.xml is missing!"
          exit 1
        fi
