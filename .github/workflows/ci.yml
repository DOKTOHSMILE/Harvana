name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: gradle assembleDebug + assembleRelease (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      # Proves: Java compiles, resources resolve, Gradle build completes.
      # Does NOT prove: CodeAssist compatibility, or any runtime behavior.
      - name: Assemble debug and release (release runs R8 shrinking)
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease
      # Static audit (Android lint). Non-blocking; the summary is printed so real breakage can be fixed.
      - name: Android lint (audit)
        continue-on-error: true
        run: |
          gradle --no-daemon lintDebug || true
          echo "===== LINT ERRORS ====="
          grep -B1 -A3 " Error:\| Fatal:" app/build/reports/lint-results-debug.txt | head -400 || true
          echo "===== LINT SUMMARY ====="
          tail -5 app/build/reports/lint-results-debug.txt || true
      # Install THIS file to test: its debug signing fingerprint is the one to register in Firebase
      # (Project settings -> Your apps -> SHA certificate fingerprints) for Google sign-in.
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harvanna-wallet-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
