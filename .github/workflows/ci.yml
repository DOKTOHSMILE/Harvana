name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: gradle assembleDebug + assembleRelease (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      # Proves: Java compiles, resources resolve, Gradle build completes.
      # Does NOT prove: CodeAssist compatibility, or any runtime behavior.
      - name: Assemble debug and release (release runs R8 shrinking)
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease
      # Static audit (Android lint). Non-blocking; the summary is printed so real breakage can be fixed.
      - name: Android lint (audit)
        continue-on-error: true
        run: |
          gradle --no-daemon lintDebug || true
          echo "===== LINT ERRORS BY KIND ====="
          grep -o "Error: .*\[[A-Za-z]*\]" app/build/reports/lint-results-debug.txt | grep -o "\[[A-Za-z]*\]$" | sort | uniq -c | sort -rn || true
          echo "===== LINT ERRORS THAT CAN BREAK BEHAVIOUR (style-only kinds hidden) ====="
          grep -E " Error: .*\[(NewApi|MissingPermission|MissingInflatedId|WrongConstant|ResourceType|InvalidPackage|MissingClass|Instantiatable|ProtectedPermissions|RtlHardcoded|ExportedContentProvider|UnsafeIntentLaunch|SetJavaScriptEnabled|Recycle|ScopedStorage|NotificationPermission|ForegroundServicePermission|ObsoleteSdkInt|UnspecifiedImmutableFlag|ExactAlarm|DefaultLocale|StringFormatInvalid|StringFormatCount|MissingTranslation|WrongThread|SimpleDateFormat|ViewHolder|ServiceCast|Override|DuplicateIds|MissingSuperCall)\]" app/build/reports/lint-results-debug.txt | sed "s#/home/runner/work/Ajoo/Ajoo/##" | head -80 || true
      # Install THIS file to test: its debug signing fingerprint is the one to register in Firebase
      # (Project settings -> Your apps -> SHA certificate fingerprints) for Google sign-in.
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harvanna-wallet-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
