name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug + assembleRelease + unit tests (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Assemble debug and release (release runs R8 shrinking)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease
      - name: Android lint (audit)
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintDebug || true
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harvanna-wallet-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
