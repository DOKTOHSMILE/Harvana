android {
    namespace 'com.harvana.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.harvana.app"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Fixed, non-secret DEBUG key so every debug build (local or CI) has the same signing
        // fingerprint. Register its SHA-1/SHA-256 in Firebase for Google sign-in.
        // Never use this for a release build.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing config. The keystore and its passwords are not in the repo - the
        // store file is dropped into app/ by the build host, and the credentials come from
        // environment variables (or a local gradle.properties that is never committed). For
        // local dry-runs set them in ~/.gradle/gradle.properties; for CI set them in the job
        // secrets so they never end up in git.
        doktohsmile {
            storeFile file('doktohsmile.keystore')
            storePassword providers.gradleProperty('DOKTOHSMILE_STORE_PASSWORD').orNull
                ?: System.getenv('DOKTOHSMILE_STORE_PASSWORD')
            keyAlias providers.gradleProperty('DOKTOHSMILE_KEY_ALIAS').orNull
                ?: System.getenv('DOKTOHSMILE_KEY_ALIAS')
            keyPassword providers.gradleProperty('DOKTOHSMILE_KEY_PASSWORD').orNull
                ?: System.getenv('DOKTOHSMILE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.doktohsmile
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
